<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 左耳 -->
  <rect x="38" y="20" width="40" height="36" rx="10" fill="#4a4a4a"/>
  <rect x="44" y="24" width="28" height="28" rx="7" fill="#f5c6a0"/>

  <!-- 右耳 -->
  <rect x="122" y="20" width="40" height="36" rx="10" fill="#4a4a4a"/>
  <rect x="128" y="24" width="28" height="28" rx="7" fill="#f5c6a0"/>

  <!-- 头部 -->
  <ellipse cx="100" cy="110" rx="68" ry="62" fill="#7a7a7a"/>
  <ellipse cx="100" cy="115" rx="60" ry="52" fill="#8a8a8a"/>

  <!-- 面部浅色区域 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#e8e8e8"/>

  <!-- 黑色眼罩（浣熊标志） -->
  <path d="M42 95 Q60 80 80 95 L80 125 Q60 130 42 115 Z" fill="#2a2a2a"/>
  <path d="M158 95 Q140 80 120 95 L120 125 Q140 130 158 115 Z" fill="#2a2a2a"/>
  <path d="M42 95 Q100 82 158 95" fill="#2a2a2a"/>

  <!-- 眼睛 -->
  <circle cx="68" cy="108" r="6" fill="white"/>
  <circle cx="68" cy="108" r="3.5" fill="#1a1a1a"/>
  <circle cx="66" cy="106" r="1.5" fill="white"/>

  <circle cx="132" cy="108" r="6" fill="white"/>
  <circle cx="132" cy="108" r="3.5" fill="#1a1a1a"/>
  <circle cx="130" cy="106" r="1.5" fill="white"/>

  <!-- 鼻子 -->
  <ellipse cx="100" cy="130" rx="8" ry="5" fill="#2a2a2a"/>
  <ellipse cx="99" cy="128" rx="3" ry="2" fill="#555"/>

  <!-- 嘴巴 -->
  <path d="M94 136 Q100 143 106 136" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="100" y1="135" x2="100" y2="140" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>

  <!-- 胡须 -->
  <line x1="42" y1="120" x2="20" y2="115" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="125" x2="18" y2="128" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="158" y1="120" x2="180" y2="115" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="158" y1="125" x2="182" y2="128" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
