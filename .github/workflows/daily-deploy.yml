name: Daily Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update deploy trigger timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > web/.deploy-trigger

      - name: Commit and push to trigger Vercel deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/.deploy-trigger
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
            exit 0
          fi
          git commit -m "chore: daily deploy trigger [skip ci]"
          git push
